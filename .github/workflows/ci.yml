name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master

defaults:
  run:
    working-directory: app

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # The full check normally finishes in minutes; retain install/network headroom without the
    # platform's six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install project with development tools
        run: python -m pip install -c scripts/dependencies/constraints.txt -e ".[dev]"

      - name: Build and smoke-test isolated wheel
        run: python scripts/check_wheel_install.py

      - name: Check formatting
        run: python -m ruff format --check src tests ui scripts

      - name: Lint
        run: python -m ruff check src tests ui scripts

      - name: Import smoke check
        run: python scripts/import_check.py

      - name: Repository safety scan
        run: |
          python scripts/check_repo_safety.py --self-test
          python scripts/check_repo_safety.py
          python scripts/check_repo_safety.py --staged

      - name: Run tests
        run: python -m pytest -q

      - name: Check release metadata and documentation links
        run: python scripts/check_release.py

  browser:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: python -m pip install -c scripts/dependencies/constraints.txt -e ".[dev,browser]"
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m ruff check tests/browser && python -m ruff format --check tests/browser
      - run: python -m pytest -q tests/browser
        env:
          ARA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: app/output/browser/
